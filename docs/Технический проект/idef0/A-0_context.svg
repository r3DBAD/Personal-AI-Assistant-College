Ответы ассистента</tspan><tspan x="990" dy="15">и результаты заданий</tspan></text><text x="30" y="830" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="30" dy="0">Цель моделирования: определить состав функций системы R3DVIS</tspan></text><text x="30" y="848" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="30" dy="0">и потоки данных между ней и внешней средой.</tspan></text><text x="30" y="875" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="30" dy="0">Точка зрения: владелец системы (студент).</tspan></text><rect x="1" y="1" width="1498" height="998" fill="none" stroke="#000" stroke-width="1.6"/><line x1="0" y1="100" x2="1500" y2="100" stroke="#000" stroke-width="1.6"/><line x1="0" y1="920" x2="1500" y2="920" stroke="#000" stroke-width="1.6"/><line x1="240" y1="0" x2="240" y2="100" stroke="#000" stroke-width="1"/><line x1="750" y1="0" x2="750" y2="100" stroke="#000" stroke-width="1"/><line x1="990" y1="0" x2="990" y2="100" stroke="#000" stroke-width="1"/><line x1="1185" y1="0" x2="1185" y2="100" stroke="#000" stroke-width="1"/><line x1="1320" y1="0" x2="1320" y2="100" stroke="#000" stroke-width="1"/><line x1="750" y1="25" x2="1185" y2="25" stroke="#000" stroke-width="1"/><line x1="750" y1="50" x2="1185" y2="50" stroke="#000" stroke-width="1"/><line x1="750" y1="75" x2="1185" y2="75" stroke="#000" stroke-width="1"/><text x="6" y="18" font-size="12" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="6" dy="0">ИСПОЛЬЗУЕТСЯ В:</tspan></text><text x="120.0" y="58" font-size="12" text-anchor="middle" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="120.0" dy="0">Технический</tspan><tspan x="120.0" dy="14">проект</tspan></text><text x="246" y="18" font-size="12" text-anchor="start" font-w