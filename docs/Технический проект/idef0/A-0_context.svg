ine points="680,920 680,630" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="680,630 675.5,642 684.5,642" fill="#000"/><text x="676" y="914" font-size="12" text-anchor="end" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="676" dy="0">M2</tspan></text><text x="686" y="670" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="686" dy="0">Серверная</tspan><tspan x="686" dy="15">часть и БД:</tspan><tspan x="686" dy="15">FastAPI,</tspan><tspan x="686" dy="15">PostgreSQL,</tspan><tspan x="686" dy="15">Redis, Celery</tspan></text><polyline points="790,920 790,630" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="790,630 785.5,642 794.5,642" fill="#000"/><text x="786" y="914" font-size="12" text-anchor="end" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="786" dy="0">M3</tspan></text><text x="796" y="670" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="796" dy="0">Бот aiogram</tspan><tspan x="796" dy="15">и языковая</tspan><tspan x="796" dy="15">модель</tspan><tspan x="796" dy="15">(GPTunnel)</tspan></text><polyline points="900,920 900,630" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="900,630 895.5,642 904.5,642" fill="#000"/><text x="896" y="914" font-size="12" text-anchor="end" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="896" dy="0">M4</tspan></text><text x="906" y="670" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="906" dy="0">Внешние</tspan><tspan x="906" dy="15">сервисы: VK,</tspan><tspan x="906" dy="15">CalDAV,</tspan><tspan x="906" dy="15">Telegram,</tspan><tspan x="906" dy="15">Claude Code</tspan></text><polyline points="960,425 1500,425" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="1500,425 1488,420.5 1