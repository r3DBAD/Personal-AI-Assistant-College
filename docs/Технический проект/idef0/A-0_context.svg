<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><rect width="1500" height="1000" fill="#fff"/><rect x="523" y="383" width="440" height="250" fill="#bdbdbd"/><rect x="520" y="380" width="440" height="250" fill="#fff" stroke="#000" stroke-width="1.6"/><text x="740.0" y="499.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="740.0" dy="0">Вести учебные и личные</tspan><tspan x="740.0" dy="16">дела студента</tspan></text><text x="955" y="625" font-size="12" text-anchor="end" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="955" dy="0">A0</tspan></text><polyline points="0,420 520,420" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="520,420 508,415.5 508,424.5" fill="#000"/><text x="4" y="435" font-size="12" text-anchor="start" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="4" dy="0">I1</tspan></text><text x="30" y="396" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="30" dy="0">Файл расписания, опубликованный</tspan><tspan x="30" dy="15">колледжем в сообществе VK (xlsx)</tspan></text><polyline points="0,475 520,475" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="520,475 508,470.5 508,479.5" fill="#000"/><text x="4" y="490" font-size="12" text-anchor="start" font-weight="bold" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="4" dy="0">I2</tspan></text><text x="30" y="451" font-size="13" text-anchor="start" font-weight="normal" font-family="'Liberation Sans', Arial, sans-serif"><tspan x="30" dy="0">Вопросы, фразы и данные,</tspan><tspan x="30" dy="15">вводимые пользователем</tspan></text><polyline points="0,530 520,530" fill="none" stroke="#000" stroke-width="1.3"/><polygon points="520,530 508,525.5 508,534.5" fill="#000"/><text x="4" y="545" font-size="12" text-anchor="start" font-weight=